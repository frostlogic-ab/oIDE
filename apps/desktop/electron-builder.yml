# electron-builder config for oIDE. Docs: docs/wiki/pages/packaging.md
# Build locally: pnpm --filter @oide/desktop dist   (unsigned; CI release builds come from tags)
appId: dev.oide.app
productName: oIDE
# Keep in sync with the installed electron (electron-builder needs an exact version with hoisted deps).
electronVersion: 45.4.1
copyright: Copyright (c) oIDE contributors. MIT licensed.
executableName: oide

directories:
  output: release/${version}
  buildResources: build

# Only the bundled output and real runtime deps ship. Everything the renderer/main bundles
# (React, @oide/* TypeScript sources, zod, …) is a devDependency and is not packaged.
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.{ts,tsx,md}"
  - "!**/{test,tests,__tests__,e2e}/**"

# Built-in extensions (loaded by the registry from <resources>/extensions) and the offline
# marketplace index (<resources>/marketplace/index.json). Main's host-process.js is in out/main.
extraResources:
  - from: ../../extensions
    to: extensions
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/*.test.*"
      - "!**/tsconfig*.json"
  - from: ../../tools/marketplace-index/bundled/index.json
    to: marketplace/index.json
  # Offline preview runtime for React designs (ADR 0013), served at oide-artifact://<id>/__oide/react-runtime.js.
  - from: out/artifact-runtime
    to: artifact-runtime
  # Licence of oIDE and the generated notices for every shipped third-party package
  # (pnpm licenses:notices; CI fails when it is stale). Electron adds LICENSES.chromium.html itself.
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

asar: true
# Native N-API prebuilds must live outside the asar archive to be loadable.
asarUnpack:
  - "**/node_modules/@lydell/node-pty*/**"
  - "**/node_modules/@parcel/watcher*/**"
  - "**/*.node"

# @lydell/node-pty and @parcel/watcher ship N-API prebuilds that work in Electron's Node as-is.
npmRebuild: false
nodeGypRebuild: false

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # Keep file:// privileges: the renderer is loaded from file:// with ES module scripts.

# No release feed by default: the GitHub org is not claimed yet (packages/protocol/src/distribution.ts),
# so a default build writes no app-update.yml and its updater stays off. The release workflow adds
# -c.publish.provider=github -c.publish.owner=$OIDE_PUBLISH_OWNER -c.publish.repo=$OIDE_PUBLISH_REPO
# -c.publish.releaseType=draft only when the repository variables OIDE_PUBLISH_OWNER/REPO are set,
# and the same values are compiled into main (electron.vite.config.ts). See docs/wiki/pages/packaging.md.
publish: null

# Update channels (apps/desktop/src/main/services/updater.ts). A version with a prerelease tag
# (0.2.0-beta.1) publishes beta*.yml; a plain version publishes latest*.yml and, with this flag, the
# beta*.yml files too, so beta users also receive stable releases.
generateUpdatesFilesForAllChannels: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # Unsigned by default. .github/workflows/release.yml adds Azure Trusted Signing
  # (-c.win.azureSignOptions.*) or a classic WIN_CSC_LINK certificate only when those secrets exist.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: oIDE

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  # Unsigned by default (local `pnpm dist` and CI without secrets). With CSC_LINK + the
  # MAC_SIGNING_IDENTITY variable, release.yml overrides -c.mac.identity and turns on notarization.
  identity: null

dmg:
  title: ${productName} ${version}

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Development
  # PNG set from tools/icons/build-icons.mjs (Windows uses build/icon.ico, macOS build/icon.icns).
  icon: build/icons
  # BrowserWindow icon on Linux (main/app-icon.ts reads <resources>/icon.png); Windows/macOS use the exe/bundle icon.
  extraResources:
    - from: build/icons/512x512.png
      to: icon.png
  maintainer: oIDE contributors
  synopsis: Run many Claude Code CLI agents in parallel, in one window.
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
