name: CI

# What runs where (docs/wiki/pages/packaging.md#ci-and-release-workflows):
#
#   job        pull request                          push to main / manual
#   changes    which kinds of files the PR touches    (everything counts as changed)
#   checks     typecheck, lint once on Linux; wiki    same, without the docs build
#              lint, licences; docs build if
#              docs/site changed
#   test       Vitest on ubuntu, windows, macos       same
#   e2e        build + Playwright on ubuntu           build + Playwright on all three OSes
#   ok         the single check to require in branch protection: fails if any job above failed
#              or was cancelled; skipped jobs count as passed
#
# Typecheck and lint give the same answer on every OS, so they run once. Unit tests stay on all three
# OSes because path handling (worktrees, junctions, PATHEXT, /private/var realpaths) is core to oIDE
# and differs per OS. Windows and macOS e2e are the slowest, flakiest jobs and run on main only.
# A PR that touches only docs (docs/**, root *.md) skips typecheck, lint, tests and e2e.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main are never cancelled (one group per
# commit), so every commit on main gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Classify
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "site=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          count=$(grep -c . <<< "$files" || true)
          code=false
          site=false
          # The files API lists at most 3000 files; past that, assume code changed.
          if (( count >= 3000 )); then code=true; fi
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == docs/site/* ]]; then
              site=true
            elif [[ "$f" == docs/wiki/pages/telemetry.md ]]; then
              code=true # test/telemetry-docs.test.ts reads it
            elif [[ "$f" == docs/* || ( "$f" != */* && "$f" == *.md ) ]]; then
              :
            else
              code=true
            fi
          done <<< "$files"
          echo "Files: $count, code changed: $code, docs site changed: $site"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  checks:
    name: Typecheck, lint, wiki, licences
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Wiki lint
        run: pnpm wiki:lint

      - name: Licences (MIT-compatible, THIRD_PARTY_NOTICES.md current)
        run: pnpm licenses:check

      # docs.yml builds and deploys the site after merge; this catches a broken build before it.
      - name: Docs site build
        if: needs.changes.outputs.site == 'true'
        run: pnpm docs:build

  test:
    name: Unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest)
        run: pnpm test

  e2e:
    name: E2E (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm --filter @oide/desktop build

      - name: E2E (Playwright for Electron, Linux under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @oide/desktop exec playwright test

      - name: E2E (Playwright for Electron)
        if: runner.os != 'Linux'
        run: pnpm --filter @oide/desktop exec playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 7

  ok:
    name: CI ok
    needs: [changes, checks, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then
              echo "::error::A CI job did not pass ($r)."
              exit 1
            fi
          done
