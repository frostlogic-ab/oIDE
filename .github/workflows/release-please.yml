name: Release Please

# The release pipeline (docs/wiki/pages/release-pipeline.md):
#   1. Pull requests are squash-merged into main with a Conventional Commit title (pr-title.yml).
#   2. On every push to main, release-please opens or updates one release PR ("chore: release X.Y.Z")
#      that bumps the version in package.json and apps/desktop/package.json and writes CHANGELOG.md.
#   3. Merging that PR makes release-please create a DRAFT release vX.Y.Z plus its tag; the `release`
#      job below then calls release.yml, which builds the installers on Windows, macOS and Linux,
#      uploads them to the draft and publishes it.
#
# Config: release-please-config.json and .release-please-manifest.json (the last released version).
#
# Token: the default GITHUB_TOKEN works, but pull requests it opens do not start other workflows, so
# the release PR shows no CI checks. If branch protection requires checks, add a fine-grained
# personal access token or GitHub App token (contents, pull requests and issues: read/write) as the
# secret RELEASE_PLEASE_TOKEN. Either way, allow "GitHub Actions to create and approve pull requests"
# in Settings > Actions > General.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, so two quick merges cannot race on the release PR. The build below is not
    # in this group, so a long release build never holds up the next release PR update.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build and publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
