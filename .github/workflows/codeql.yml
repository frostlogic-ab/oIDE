name: CodeQL

on:
  push:
    branches: [main]
  # Docs-only pull requests have nothing to scan. Push to main always runs: it is the baseline
  # that pull request alerts are compared against.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are not (one group per commit).
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/out'
              - docs/wiki/raw
              - tools/fake-claude/fixtures

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
