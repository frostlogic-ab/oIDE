name: Release

# Builds the installers for every supported platform and publishes them on a GitHub Release. The
# whole pipeline (release-please, then this workflow) is described in
# docs/wiki/pages/release-pipeline.md; packaging details in docs/wiki/pages/packaging.md.
#
#   1. release-please.yml: merging the release PR creates a DRAFT release vX.Y.Z (and its tag) and
#      calls this workflow with `tag: vX.Y.Z`.
#   2. verify: the tag must equal apps/desktop/package.json "version" (with a leading v); then
#      typecheck, lint, test and licences.
#   3. build: one job per OS; electron-builder uploads the installers and the update feed
#      (latest*.yml; its GitHub publisher writes no beta*.yml) to the draft release of that tag.
#   4. finalize: SHA256SUMS (and GPG signatures when the key exists), then tools/release/verify-feed.mjs
#      checks that every platform's latest*.yml is there and names only attached files, then the
#      release is published: marked latest for 0.2.0, pre-release for 0.2.0-beta.1 (the beta channel
#      takes the newest release, prerelease or not). If any build or the feed check fails, the release
#      stays a draft and nothing reaches users; fix it and re-run the failed jobs.
#
# Manual run (Actions > Release > Run workflow): with a tag, (re)builds that tag into its release;
# without one, builds the selected branch as workflow artifacts and publishes nothing.
#
# Repository variables (all optional):
#   OIDE_PUBLISH_OWNER / OIDE_PUBLISH_REPO  release feed compiled into the app and used for uploads.
#                                           Default: the repository this workflow runs in.
#   OIDE_RELEASE_KEEP_DRAFT=true            leave finished releases as drafts for a maintainer to
#                                           publish by hand (for example to try signed installers).
#
# Code signing is optional and switched on per platform only when its secrets exist, so forks and
# the unsigned betas build without any account:
#   Windows  Azure Trusted Signing: secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and
#            variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#            AZURE_SIGNING_PUBLISHER (the certificate subject CN; electron-updater checks it).
#            Or a classic certificate: secrets WIN_CSC_LINK (base64 .pfx or URL), WIN_CSC_KEY_PASSWORD.
#   macOS    Developer ID: secrets CSC_LINK, CSC_KEY_PASSWORD and variable MAC_SIGNING_IDENTITY
#            ("Your Name (TEAMID)"). Notarization: secrets APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#            APPLE_TEAM_ID, or an App Store Connect key: APPLE_API_KEY (.p8 contents),
#            APPLE_API_KEY_ID, APPLE_API_ISSUER.
#   Linux    secrets GPG_PRIVATE_KEY (armored) and GPG_PASSPHRASE: detached .asc signatures for the
#            AppImage, deb, rpm and SHA256SUMS files.

# No `push: tags` trigger: release-please creates the tag and calls this workflow itself, so a tag
# created with a personal token (RELEASE_PLEASE_TOKEN) cannot start a second, racing build.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (vX.Y.Z), created by release-please.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and publish, e.g. v0.2.0. Empty builds workflow artifacts only.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches the app version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" != "v$version" ]]; then
              echo "::error::The release tag does not match apps/desktop/package.json version $version (expected v$version)."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # No dependency cache in release builds: a poisoned cache entry must never reach a signed installer.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Third-party notices are current
        run: pnpm licenses:check

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # electron-builder uploads to the draft release of this tag (release-please created it; a manual
    # run with a tag that has no release yet creates the draft).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # No dependency cache in release builds: a poisoned cache entry must never reach a signed installer.

      - name: Install
        run: pnpm install --frozen-lockfile

      # The release feed (GitHub owner/repo) compiled into main and used by electron-builder for the
      # upload: the repository variables when set, else the repository this workflow runs in.
      - name: Release feed
        shell: bash
        env:
          OWNER_VAR: ${{ vars.OIDE_PUBLISH_OWNER }}
          REPO_VAR: ${{ vars.OIDE_PUBLISH_REPO }}
        run: |
          owner="${OWNER_VAR:-${GITHUB_REPOSITORY%%/*}}"
          repo="${REPO_VAR:-${GITHUB_REPOSITORY#*/}}"
          echo "OIDE_PUBLISH_OWNER=$owner" >> "$GITHUB_ENV"
          echo "OIDE_PUBLISH_REPO=$repo" >> "$GITHUB_ENV"
          echo "Release feed: $owner/$repo"

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Secrets cannot be used in `if:` directly; expose only whether each one is set.
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set_flag() { if [[ "$2" == "yes" ]]; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          all() { for v in "$@"; do [[ -n "${!v}" ]] || { echo no; return; }; done; echo yes; }
          set_flag azure "$(all AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER)"
          set_flag win_csc "$(all WIN_CSC_LINK)"
          set_flag mac_sign "$(all CSC_LINK MAC_SIGNING_IDENTITY)"
          set_flag notarize_id "$(all APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)"
          set_flag notarize_key "$(all APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)"

      - name: Build app
        # OIDE_PUBLISH_OWNER / OIDE_PUBLISH_REPO (from "Release feed") are compiled into main
        # (electron.vite.config.ts), so the installed app checks this repository's releases.
        run: pnpm --filter @oide/desktop build

      - name: Every shipped font has a recorded licence
        # With out/renderer present, the check also matches each built font file to a record.
        run: pnpm licenses:check

      - name: App Store Connect key file
        if: runner.os == 'macOS' && steps.signing.outputs.mac_sign == 'true' && steps.signing.outputs.notarize_key == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$key"
          echo "APPLE_API_KEY_FILE=$key" >> "$GITHUB_ENV"

      - name: Package (signing only where its secrets exist)
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ needs.verify.outputs.publish == 'true' && 'always' || 'never' }}
          HAS_AZURE: ${{ steps.signing.outputs.azure }}
          HAS_WIN_CSC: ${{ steps.signing.outputs.win_csc }}
          HAS_MAC_SIGN: ${{ steps.signing.outputs.mac_sign }}
          HAS_NOTARIZE_ID: ${{ steps.signing.outputs.notarize_id }}
          HAS_NOTARIZE_KEY: ${{ steps.signing.outputs.notarize_key }}
          # Windows: Azure Trusted Signing (electron-builder reads these from the env).
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          # Windows: classic certificate.
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # macOS: Developer ID certificate and notarization.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          # electron-builder.yml has `publish: null`; the feed comes from the "Release feed" step and is
          # passed here. With releaseType=draft electron-builder uploads to the existing draft release
          # of the tag. Without a feed nothing is uploaded, no app-update.yml is written and the
          # app's updater stays off (docs/wiki/pages/packaging.md).
          if [[ -n "$OIDE_PUBLISH_OWNER" && -n "$OIDE_PUBLISH_REPO" ]]; then
            args=(--config electron-builder.yml --publish "$PUBLISH"
                  -c.publish.provider=github "-c.publish.owner=$OIDE_PUBLISH_OWNER"
                  "-c.publish.repo=$OIDE_PUBLISH_REPO" -c.publish.releaseType=draft)
          else
            echo "::warning::No release feed: building without one (no upload, updater off)."
            args=(--config electron-builder.yml --publish never)
          fi
          case "$RUNNER_OS" in
            Windows)
              if [[ "$HAS_AZURE" == "true" ]]; then
                echo "Signing with Azure Trusted Signing"
                args+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
                       "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                       "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
                       "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER")
              elif [[ "$HAS_WIN_CSC" == "true" ]]; then
                echo "Signing with the WIN_CSC_LINK certificate"
              else
                echo "::warning::Windows build is unsigned (no signing secrets). SmartScreen will warn."
                unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
              fi
              ;;
            macOS)
              if [[ "$HAS_MAC_SIGN" == "true" ]]; then
                echo "Signing with Developer ID"
                args+=("-c.mac.identity=$MAC_SIGNING_IDENTITY")
                if [[ "$HAS_NOTARIZE_KEY" == "true" ]]; then
                  export APPLE_API_KEY="$APPLE_API_KEY_FILE"
                  args+=(-c.mac.notarize=true)
                elif [[ "$HAS_NOTARIZE_ID" == "true" ]]; then
                  args+=(-c.mac.notarize=true)
                else
                  echo "::warning::macOS build is signed but not notarized (no Apple notarization secrets)."
                fi
              else
                echo "::warning::macOS build is unsigned (no CSC_LINK / MAC_SIGNING_IDENTITY). Gatekeeper will block it and auto-update cannot install."
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                unset CSC_LINK CSC_KEY_PASSWORD
              fi
              ;;
            Linux)
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              ;;
          esac
          pnpm exec electron-builder "${args[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oide-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.rpm
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Checksums, signatures and publish
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      # Only tools/release (the feed check), from the workflow's own commit: plain Node, no install.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tools/release
          path: src

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: oide-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} upload/ \;
          (cd upload && sha256sum * | sort -k2 > SHA256SUMS)
          cat upload/SHA256SUMS

      - name: Detect GPG key
        id: gpg
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: if [[ -n "$GPG_PRIVATE_KEY" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: GPG detached signatures (Linux packages and SHA256SUMS)
        if: steps.gpg.outputs.present == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd upload
          for f in *.AppImage *.deb *.rpm SHA256SUMS; do
            [[ -f "$f" ]] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --output "$f.asc" "$f"
          done
          rm -rf "$GNUPGHOME"

      - name: Upload checksums and signatures to the draft release
        shell: bash
        run: |
          files=(upload/SHA256SUMS)
          for f in upload/*.asc; do [[ -f "$f" ]] && files+=("$f"); done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # electron-updater reads these latest*.yml files from the published release and downloads the
      # files they name; a missing platform feed or a wrong asset would break updates for that platform.
      - name: Update feed is complete
        shell: bash
        run: |
          feed="$RUNNER_TEMP/feed"
          gh release download "$TAG" --pattern 'latest*.yml' --dir "$feed" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json assets --jq '[.assets[] | {name, size}]' --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/assets.json"
          node src/tools/release/verify-feed.mjs --version "${TAG#v}" --feed "$feed" --assets "$RUNNER_TEMP/assets.json"

      # Only now, with every installer, update file and checksum attached, does the release become
      # visible: electron-updater cannot see drafts, so no user is offered a half-uploaded release.
      - name: Publish the release
        shell: bash
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          KEEP_DRAFT: ${{ vars.OIDE_RELEASE_KEEP_DRAFT }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if [[ "$KEEP_DRAFT" == "true" ]]; then
            gh release edit "$TAG" "${flags[@]}" --draft=true --repo "$GITHUB_REPOSITORY"
            echo "::notice::OIDE_RELEASE_KEEP_DRAFT is on: $TAG stays a draft. Publish it by hand in GitHub Releases."
          else
            gh release edit "$TAG" "${flags[@]}" --draft=false --repo "$GITHUB_REPOSITORY"
            echo "::notice::Published $TAG."
          fi
