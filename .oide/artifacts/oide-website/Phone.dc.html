<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oIDE website · Home on a phone</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%;">
  <dc-import name="Main" theme="{{ theme }}" visitor="{{ visitor }}" hint-size="100%,4590px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"visitor":{"editor":"enum","options":["Detect","macOS","Windows","Linux"],"default":"Detect","section":"Download button"},"$preview":{"width":390,"height":4590}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'Dark', visitor: this.props.visitor ?? 'Detect' };
  }
}
</script>
</body>
</html>
